upstream django {
    server web:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # Certbot challenge (needed for SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server
server {
    listen 443 ssl http2;
    server_name daycares.pk www.daycares.pk;   # ← change to your domain

    ssl_certificate     /etc/letsencrypt/live/daycares.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daycares.pk/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip
    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length   1024;
    gzip_vary         on;

    client_max_body_size 10M;

    # Static files served directly by Nginx (fast, no Django overhead)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Sitemap + robots — cache at Nginx level
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        proxy_pass         http://django;
        proxy_cache_valid  200 1h;
    }

    # Django app
    location / {
        proxy_pass          http://django;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }
}
