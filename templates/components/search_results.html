{% if results %}
  {% for listing in results %}
  <a href="{{ listing.get_absolute_url }}"
     class="flex items-start gap-3 px-4 py-3 hover:bg-gray-50 border-b border-gray-100 last:border-0">
    <div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center shrink-0 mt-0.5">
      <svg class="w-4 h-4 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
      </svg>
    </div>
    <div class="min-w-0">
      <p class="text-sm font-medium text-gray-800 truncate">{{ listing.name }}</p>
      <p class="text-xs text-gray-500 truncate">{{ listing.area.name|default:listing.city.name }} · ⭐ {{ listing.rating }}</p>
    </div>
  </a>
  {% endfor %}
{% elif q %}
  <p class="px-4 py-3 text-sm text-gray-500">No results for "<strong>{{ q }}</strong>"</p>
{% endif %}
